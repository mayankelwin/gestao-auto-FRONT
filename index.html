<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão Auto</title>
    <style>
      /* Splash: pintado antes de qualquer JS. Sai em main.ts, via esconderSplash(). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #0b1d33;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash[data-saindo] {
        opacity: 0;
        pointer-events: none;
      }
      .splash-marca {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .splash-marca img {
        display: block;
        width: 52px;
        height: 52px;
        object-fit: contain;
      }
      .splash-nome {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .splash-nome b {
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #fff;
      }
      .splash-nome span {
        margin-top: 0.4rem;
        font-size: 0.5rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #f2c230;
      }
      .splash-barra {
        position: relative;
        width: 160px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(185, 198, 214, 0.2);
      }
      .splash-barra::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: #f2c230;
        animation: splash-desliza 1.1s ease-in-out infinite;
      }
      @keyframes splash-desliza {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-barra::after {
          width: 100%;
          animation: splash-pulsa 1.6s ease-in-out infinite;
        }
        @keyframes splash-pulsa {
          0%, 100% { opacity: 0.35; }
          50% { opacity: 1; }
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Carregando Gestão Auto">
      <div class="splash-marca">
        <img src="/src/assets/logo-mark.png" alt="" width="52" height="52" />
        <span class="splash-nome">
          <b>GESTÃO AUTO</b>
          <span>DADOS · PLANEJAMENTO · RESULTADOS</span>
        </span>
      </div>
      <div class="splash-barra"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
